[package]
name = "ant"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["web", "common"]
# The web crate only builds for wasm32, so keep it out of plain `cargo build`
# at the root; Trunk builds it explicitly.
default-members = ["."]

[dependencies]
ant-common = { path = "common" }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
base64 = "0.23.1"
openidconnect = "4.0.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }
time = "0.3.55"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
