[package]
name = "ant"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

# One crate, built twice by `dx`: with `server` into the axum binary, and with
# `web` into the wasm bundle it hydrates. Anything that can't build for wasm32
# (sqlx, axum, openidconnect, ...) is optional and pulled in only by `server`.
#
# Both are on by default so a plain `cargo build` / rust-analyzer sees all the
# code; the wasm check is
#   cargo clippy --no-default-features --features web --target wasm32-unknown-unknown

[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:anyhow",
    "dep:axum",
    "dep:axum-extra",
    "dep:base64",
    "dep:openidconnect",
    "dep:rand",
    "dep:serde_json",
    "dep:sha2",
    "dep:sqlx",
    "dep:time",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
# Shared by both builds.
chrono = { version = "0.4.45", features = ["serde"] }
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.1", features = ["serde"] }

# Server only.
anyhow = { version = "1.0", optional = true }
axum = { version = "0.8.9", optional = true }
axum-extra = { version = "0.12.6", features = ["cookie-private"], optional = true }
base64 = { version = "0.23.1", optional = true }
openidconnect = { version = "4.0.1", optional = true }
rand = { version = "0.10.3", optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
], optional = true }
time = { version = "0.3.55", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
