[package]
name = "ant-web"
version = "0.1.0"
edition = "2024"

# Browser-side app. Built to wasm32-unknown-unknown by Trunk, never by the
# server's `cargo run`.

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
gloo-net = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen-futures = "0.4"
