user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- hardening ---------------------------------------------------------
    server_tokens off;                 # don't advertise the nginx version
    client_max_body_size 10m;          # cap upload size
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    ignore_invalid_headers on;

    # Slowloris-ish protection: don't let a client hold a worker open.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    reset_timedout_connection on;

    # ---- coarse rate limiting ---------------------------------------------
    # Keyed on client IP. 10MB zone ~= 160k tracked addresses.
    limit_req_zone  $binary_remote_addr zone=perip:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=perip_auth:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # ---- logging -----------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time us=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Websocket/SSE upgrade passthrough.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
