upstream ant_app {
    # Resolved on the compose network; the app container is never published.
    server app:6353 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Global-ish ceilings for a single client.
    limit_conn conn_perip 32;
    limit_req  zone=perip burst=40 nodelay;

    # Only allow the verbs the app actually uses.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "no-referrer"    always;

    # Never serve dotfiles even if something ends up in a mounted root.
    location ~ /\. {
        deny all;
    }

    # Tighter bucket for anything auth-shaped: brute force is the thing we
    # actually care about slowing down in dev.
    location ~ ^/(api/)?(auth|login|signup|register|password) {
        limit_req zone=perip_auth burst=5 nodelay;
        proxy_pass http://ant_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Proxy health check, answered by nginx itself.
    location = /healthz {
        access_log off;
        limit_req  zone=perip burst=100 nodelay;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://ant_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
