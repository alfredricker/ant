# ---------------------------------------------------------------------------
# ant :: dev stack
#   nginx  -> published on the host, rate limits, proxies to app
#   app    -> `dx serve` (Dioxus fullstack on axum) on 6353, container-network only
#   db     -> postgres + pgvector
# The app image builds from the repo root (it needs Cargo.toml); db and nginx
# build from this directory.
# ---------------------------------------------------------------------------
name: ant_dev

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: ant/db:dev
    container_name: ant_dev_db
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ant}
      POSTGRES_DB: ${POSTGRES_DB:-ant}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Loopback only — handy for psql//migrations, not reachable off-box.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ant} -d ${POSTGRES_DB:-ant}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - ant_dev_default

  app:
    build:
      context: ../..
      dockerfile: build/dev/Dockerfile.app
    image: ant/app:dev
    container_name: ant_dev_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - env/.env
      # Local secrets (Google OAuth client); gitignored, optional.
      - path: env/.env.local
        required: false
    environment:
      # Also what sqlx's query! macros check against at compile time; the
      # committed .sqlx/ is only used where no database is reachable.
      DATABASE_URL: postgres://${POSTGRES_USER:-ant}:${POSTGRES_PASSWORD:-ant}@db:5432/${POSTGRES_DB:-ant}
      RUST_LOG: ${RUST_LOG:-debug}
    # No `ports:` on purpose — reachable only through nginx.
    expose:
      - "6353"
    volumes:
      - ../../src:/app/src
      - ../../assets:/app/assets
      - ../../Cargo.toml:/app/Cargo.toml
      - ../../Cargo.lock:/app/Cargo.lock
      - ../../build.rs:/app/build.rs
      - ../../migrations:/app/migrations
      # Dev example data, run by the entrypoint after migrations.
      - ./seed.sql:/app/seed.sql:ro
      # Writable, so `cargo sqlx prepare` in here updates the committed copy.
      - ../../.sqlx:/app/.sqlx
      - cargo_target:/build-target
      - cargo_registry:/usr/local/cargo/registry
      # dx's downloaded tools (wasm-bindgen), so they survive container restarts.
      - dx_tools:/root/.local/share/.dx
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6353/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - ant_dev_default

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ant/nginx:dev
    container_name: ant_dev_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-8035}:80"
    volumes:
      # Edit the conf and `./start.sh -r nginx` — no image rebuild needed.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - ant_dev_default

volumes:
  db_data:
  cargo_target:
  cargo_registry:
  dx_tools:

networks:
  ant_dev_default:
    name: ant_dev_default
